assert_lefthook_installed: true

pre-commit:
  piped: true
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
    fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.go"
      # Never pass a bare file list to `golangci-lint run`: one file of a
      # multi-file package reports phantom typecheck errors. Lint packages.
      run: printf '%s\n' {staged_files} | xargs -n1 dirname | sort -u | xargs golangci-lint run --fix
      stage_fixed: true
    mod-tidy:
      glob: "*.{go,mod,sum}"
      run: go mod tidy
    # Workflow YAML is only exercised by pushing it, so a typo in an expression
    # or a shell block is found by a failed run on main. actionlint shellchecks
    # every `run:` block too, which is where this repo's workflow logic lives.
    actions:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

pre-push:
  commands:
    test:
      run: go test -race ./...

post-checkout:
  commands:
    kasetto:
      run: command -v kst >/dev/null 2>&1 && kst sync -q --color never || true
